<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" (click)="onBackdropClick($event)">
  <div class="bg-[#1a1a1a] border border-[#333] rounded-2xl w-full max-w-md mx-4 shadow-2xl">
    <!-- Header -->
    <div class="p-6 text-center">
      <div class="w-16 h-16 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center mx-auto mb-4">
        <span class="material-icons text-3xl text-red-400">warning</span>
      </div>
      <h2 class="text-xl font-bold text-white mb-2">Delete Scheduled Interview</h2>
      <p class="text-neutral-400">
        Are you sure you want to delete the scheduled interview for <span class="font-semibold text-white">{{ candidateName }}</span>@if (positionTitle) { ({{ positionTitle }}) }? This action cannot be undone.
      </p>
      @if (errorMessage()) {
        <div class="bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 mt-4">
          <p class="text-red-400 text-sm font-medium text-center">{{ errorMessage() }}</p>
        </div>
      }
    </div>

    <!-- Actions -->
    <div class="flex gap-4 p-6 pt-0">
      <button (click)="close()" [disabled]="isDeleting()" class="flex-1 px-6 py-3 rounded-xl border border-[#333] text-white font-bold hover:bg-[#1a1a1a] transition-colors disabled:opacity-50">
        Cancel
      </button>
      <button (click)="confirmDelete()" [disabled]="isDeleting()" class="flex-1 px-6 py-3 rounded-xl bg-red-500 hover:bg-red-600 text-white font-bold transition-colors disabled:opacity-50 flex justify-center items-center gap-2">
        @if (isDeleting()) {
          <span class="material-icons text-[18px] animate-spin">hourglass_empty</span> Deleting...
        } @else {
          <span class="material-icons text-[18px]">delete</span> Delete
        }
      </button>
    </div>
  </div>
</div>
