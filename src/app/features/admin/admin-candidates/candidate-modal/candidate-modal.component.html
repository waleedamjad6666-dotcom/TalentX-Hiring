<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" (click)="onBackdropClick($event)">
  <div class="bg-[#1a1a1a] border border-[#333] rounded-2xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-[#262626]">
      <div>
        <h2 class="text-xl font-bold text-white">{{ isEditMode() ? 'Edit Candidate' : 'Create New Candidate' }}</h2>
        <p class="text-sm text-neutral-400 mt-1">{{ isEditMode() ? 'Update the candidate details below.' : 'Fill in the candidate details below.' }}</p>
      </div>
      <button (click)="close()" class="w-9 h-9 rounded-lg bg-[#111111] border border-[#333] hover:bg-[#262626] flex items-center justify-center text-neutral-400 hover:text-white transition-colors">
        <span class="material-icons text-[20px]">close</span>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="p-6 space-y-5">
      <!-- Name Row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">First Name *</label>
          <input type="text" formControlName="firstname" placeholder="" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Last Name *</label>
          <input type="text" formControlName="lastname" placeholder="" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
      </div>

      <!-- Contact Row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Email *</label>
          <input type="email" formControlName="email" placeholder="" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Phone *</label>
          <input type="tel" formControlName="phone" placeholder="" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
      </div>

      <!-- Experience Row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Experience</label>
          <input type="text" formControlName="experience" placeholder="e.g. 3 Years" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
        <div>
          <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Current Position</label>
          <input type="text" formControlName="currentPosition" placeholder="e.g. Senior Developer" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        </div>
      </div>

      <!-- Company -->
      <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Current Company</label>
        <input type="text" formControlName="currentCompany" placeholder="" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
      </div>

      <!-- Skills -->
      <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Skills *</label>
        <input type="text" formControlName="skills" placeholder="(comma-separated)" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors">
        <p class="text-xs text-neutral-500 mt-1 ml-1">Separate skills with commas</p>
      </div>

      <!-- Notes -->
      <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Notes</label>
        <textarea formControlName="notes" rows="3" placeholder="Additional notes about the candidate" class="w-full bg-[#111111] border border-[#333] rounded-xl px-4 py-3 text-white outline-none focus:border-[#FBBF24] transition-colors resize-none"></textarea>
      </div>

      <!-- Resume Upload -->
      <div>
        <label class="block text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2 ml-1">Resume</label>
        @if (!selectedFileName()) {
          <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-[#333] rounded-xl cursor-pointer hover:border-[#FBBF24]/50 hover:bg-[#FBBF24]/5 transition-all group">
            <span class="material-icons text-3xl text-neutral-500 group-hover:text-[#FBBF24] transition-colors mb-2">cloud_upload</span>
            <span class="text-sm text-neutral-400 group-hover:text-neutral-300 transition-colors">Click to upload resume</span>
            <span class="text-xs text-neutral-600 mt-1">PDF or DOCX, max 10MB</span>
            <input type="file" class="hidden" accept=".pdf,.docx,.doc" (change)="onFileSelected($event)">
          </label>
        } @else {
          <div class="flex items-center gap-3 bg-[#111111] border border-[#333] rounded-xl px-4 py-3">
            <span class="material-icons text-[#FBBF24] text-[20px]">description</span>
            <span class="text-white text-sm flex-1 truncate">{{ selectedFileName() }}</span>
            <button type="button" (click)="removeFile()" class="text-neutral-500 hover:text-red-400 transition-colors">
              <span class="material-icons text-[18px]">close</span>
            </button>
          </div>
        }
      </div>

      <!-- Actions -->
      <div class="flex gap-4 pt-4 border-t border-[#262626]">
        <button type="submit" [disabled]="form.invalid || isSubmitting()" class="flex-1 bg-[#FBBF24] hover:bg-[#FACC15] text-black font-bold py-3.5 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(251,191,36,0.15)] hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
          @if (isSubmitting()) {
            <span class="material-icons text-[20px] animate-spin">hourglass_empty</span> {{ isEditMode() ? 'Updating...' : 'Creating...' }}
          } @else {
            <span class="material-icons text-[20px]">{{ isEditMode() ? 'save' : 'person_add' }}</span> {{ isEditMode() ? 'Update Candidate' : 'Create Candidate' }}
          }
        </button>
        <button type="button" (click)="close()" class="px-8 bg-[#111111] border border-[#333] hover:bg-[#262626] text-white font-bold rounded-xl transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
